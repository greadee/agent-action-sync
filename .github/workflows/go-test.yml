name: go test

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "gofmt is required for:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run portable record and API contract tests
        run: go test ./internal/project ./internal/api -run "Contract|GoldenPortableRecords|LocalAdminAPIContract" -count=1

      - name: Run focused race detector
        if: runner.os == 'Linux'
        run: go test -race ./internal/sync ./internal/transfer ./internal/filesystem

      - name: Run desktop node Slice 1 release gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/check_desktop_node_slice1_release.ps1 -SkipTests

      - name: Run desktop node Slice 2 release gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/check_desktop_node_slice2_release.ps1 -SkipTests

      - name: Run desktop node Slice 3 release gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/check_desktop_node_slice3_release.ps1 -SkipTests

      - name: Run desktop node Slice 4 release gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/check_desktop_node_slice4_release.ps1 -SkipTests

      - name: Run desktop node Slice 5 release gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/check_desktop_node_slice5_release.ps1 -SkipTests

      - name: Run desktop node Slice 6 release gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/check_desktop_node_slice6_release.ps1 -SkipTests
